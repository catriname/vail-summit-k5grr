name: Build and Deploy Web Flasher

on:
  push:
    branches: [ fork-main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.14

      - name: Install libraries (registry)
        run: |
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install "Adafruit BusIO"@1.17.4
          arduino-cli lib install "Adafruit LC709203F"@1.3.4
          arduino-cli lib install "Adafruit MAX1704X"@1.0.3
          arduino-cli lib install "ArduinoJson"@7.4.3
          arduino-cli lib install "LovyanGFX"@1.1.16
          arduino-cli lib install "lvgl"@8.3.11
          arduino-cli lib install "NimBLE-Arduino"@1.4.2
          arduino-cli lib install "WebSockets"@2.7.2

      - name: Install async libraries (git, pinned)
        run: |
          arduino-cli lib install --git-url https://github.com/ESP32Async/AsyncTCP.git#v3.3.2
          arduino-cli lib install --git-url https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.6.0

      - name: Stage lv_conf.h next to lvgl
        run: |
          cp lv_conf.h "$HOME/Arduino/libraries/"

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:adafruit_feather_esp32s3:CDCOnBoot=cdc,PartitionScheme=huge_app,PSRAM=enabled,FlashSize=4M,USBMode=hwcdc" \
            --output-dir build \
            --export-binaries \
            .

      - name: Install esptool
        run: pip install esptool

      - name: Merge bins for web flasher
        run: |
          mkdir -p public
          BOOT=$(ls build/*.bootloader.bin)
          PART=$(ls build/*.partitions.bin)
          APP=$(ls build/*.ino.bin | grep -v bootloader | grep -v partitions | head -n1)
          BOOT_APP=build/boot_app0.bin
          # boot_app0.bin lives in the ESP32 core; locate it
          BOOT_APP_SRC=$(find ~/.arduino15/packages/esp32 -name boot_app0.bin | head -n1)
          esptool.py --chip esp32s3 merge_bin \
            -o public/vail-summit.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 "$BOOT" \
            0x8000 "$PART" \
            0xe000 "$BOOT_APP_SRC" \
            0x10000 "$APP"

      - name: Copy flasher UI
        run: cp -r flasher/* public/

      - name: Stamp version into manifest
        run: |
          VERSION=$(git describe --tags --always --dirty)
          echo "Stamping version: $VERSION"
          sed -i "s/\"version\": \"dev\"/\"version\": \"${VERSION}\"/" public/manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
